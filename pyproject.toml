[project]
name = "weave-agent"
version = "0.1.0"
description = "Commitment-verified action items from Google Meet transcripts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[eval]==2.5.0",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-modelarmor>=0.2.0",
    "google-genai>=2.19.0",
    "pyyaml>=6.0.2",
    "weave-common",
]

[dependency-groups]
dev = [
    "google-cloud-aiplatform[agent-engines]>=1.112.0",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
]

[tool.uv.workspace]
members = ["shared", "services/ingestion", "services/subscription_manager"]

[tool.uv.sources]
weave-common = { workspace = true }
weave-ingestion = { workspace = true }
weave-subscriptions = { workspace = true }

[tool.uv.build-backend]
module-name = "agent"
module-root = ""

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
