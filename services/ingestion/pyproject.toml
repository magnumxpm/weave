[project]
name = "weave-ingestion"
version = "0.1.0"
description = "Weave ingestion and delivery interfaces"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "google-api-python-client>=2.166.0",
    "google-auth>=2.38.0",
    "google-cloud-aiplatform[agent-engines]>=1.112.0",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-modelarmor>=0.2.0",
    "google-cloud-run>=0.12.0",
    "google-genai>=2.19.0",
    "uvicorn>=0.34.0",
    "weave-common",
]

[tool.uv.sources]
weave-common = { workspace = true }

[tool.uv.build-backend]
module-name = "weave_ingestion"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
