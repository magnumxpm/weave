[project]
name = "weave-subscriptions"
version = "0.1.0"
description = "Per-user Meet transcript subscription manager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-api-python-client>=2.166.0",
    "google-auth>=2.38.0",
    "weave-ingestion",
]

[tool.uv.sources]
weave-ingestion = { workspace = true }

[tool.uv.build-backend]
module-name = "weave_subscriptions"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
